name: Phase 1 Game Stability

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Phase 1 state handling once
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")
          marker = "/* phase1-stability-v1 */"

          if marker not in text:
              text = text.replace(
                  "let savedGameId = 0;",
                  "let savedGameId = 0;\nlet aiTimerId = null;\nlet gameSessionId = 0"
              )

              anchor = "function updateDocumentTitle() {"
              helpers = '''function clearAiTimer() {
                if (aiTimerId !== null) {
                  window.clearTimeout(aiTimerId);
                  aiTimerId = null;
                }
                aiThinking = false;
              }

              function scheduleAiMove(delay = 760) {
                clearAiTimer();
                if (!aiToggle.checked || game.isGameOver() || game.turn() !== 'b') return;

                const session = gameSessionId;
                aiThinking = true;
                updatePanels();
                aiTimerId = window.setTimeout(() => {
                  aiTimerId = null;
                  if (session !== gameSessionId || !aiToggle.checked || game.isGameOver() || game.turn() !== 'b') {
                    aiThinking = false;
                    renderBoard();
                    return;
                  }
                  makeAiMove();
                  aiThinking = false;
                  renderBoard();
                }, delay);
              }

              '''
              text = text.replace(anchor, helpers + anchor, 1)

              play_pattern = re.compile(r"function playMove\\(from, to, promotion = 'q', fromAi = false\\) \\{.*?\\n\\}\\n\\nfunction makeAiMove\\(\\)", re.S)
              new_play = '''function playMove(from, to, promotion = 'q', fromAi = false) {
                if ((!fromAi && aiThinking) || game.isGameOver()) return;
                try {
                  const move = game.move({ from, to, promotion });
                  if (!move) return;

                  movingSquare = to;
                  lastMove = { from, to };
                  selectedSquare = null;
                  matchHistory = game.history({ verbose: true });
                  const event = createEvent(move);
                  matchEvents.push(event);
                  checkEvents = matchHistory.filter((item) => item.san?.includes('+') || item.san?.includes('#')).length;
                  captureEvents = matchHistory.filter((item) => item.captured).length;
                  persistGame();

                  if (event.severity >= 3) triggerCrownEvent(event);
                  playSound(event.type === 'checkmate' ? 'mate' : isCapture(move) ? 'capture' : 'move');

                  renderBoard();
                  updateDocumentTitle();

                  window.setTimeout(() => {
                    movingSquare = null;
                    renderBoard();
                  }, 460);

                  if (game.isGameOver()) {
                    clearAiTimer();
                    window.setTimeout(showResult, 650);
                    return;
                  }

                  if (!fromAi && aiToggle.checked && game.turn() === 'b') {
                    scheduleAiMove();
                  }
                } catch (error) {
                  console.warn('Black Crown rejected a move.', error);
                  selectedSquare = null;
                  renderBoard();
                }
              }

              function makeAiMove()'''
              text, count = play_pattern.subn(new_play, text, count=1)
              if count != 1:
                  raise SystemExit("Could not locate playMove() for the Phase 1 patch")

              reset_pattern = re.compile(r"function resetGame\\(\\) \\{\\n")
              text = reset_pattern.sub("function resetGame() {\\n  clearAiTimer();\\n  gameSessionId += 1;\\n", text, count=1)

              toggle_pattern = re.compile(r"aiToggle\\.addEventListener\\('change', \\(\\) => \\{.*?\\n\\}\\);", re.S)
              toggle_replacement = '''aiToggle.addEventListener('change', () => {
                selectedSquare = null;
                if (!aiToggle.checked) {
                  clearAiTimer();
                } else if (game.turn() === 'b' && !game.isGameOver()) {
                  scheduleAiMove(420);
                }
                persistGame();
                renderBoard();
              });'''
              text, count = toggle_pattern.subn(toggle_replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Could not locate AI toggle handler")

              text = text.replace(
                  "buildDust();\\nrestoreSavedGame();\\nrenderBoard();",
                  "buildDust();\\nrestoreSavedGame();\\nrenderBoard();\\nif (aiToggle.checked && game.turn() === 'b' && !game.isGameOver()) scheduleAiMove(420);"
              )
              text += "\\n" + marker + "\\n"
              path.write_text(text, encoding="utf-8")
          PY

      - name: Patch explicit draw handling once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")
          marker = "/* phase1-draw-v1 */"

          if marker not in text:
              helper = '''function isDrawState() {
                return Boolean(
                  (typeof game.isDraw === 'function' && game.isDraw()) ||
                  (typeof game.isInsufficientMaterial === 'function' && game.isInsufficientMaterial()) ||
                  (typeof game.isStalemate === 'function' && game.isStalemate()) ||
                  (typeof game.isThreefoldRepetition === 'function' && game.isThreefoldRepetition()) ||
                  (typeof game.isDrawByFiftyMoves === 'function' && game.isDrawByFiftyMoves())
                );
              }

              function isGameOverState() {
                return game.isCheckmate() || isDrawState();
              }

              function getDrawReason() {
                if (typeof game.isInsufficientMaterial === 'function' && game.isInsufficientMaterial()) return 'Insufficient material';
                if (typeof game.isStalemate === 'function' && game.isStalemate()) return 'Stalemate';
                if (typeof game.isThreefoldRepetition === 'function' && game.isThreefoldRepetition()) return 'Threefold repetition';
                if (typeof game.isDrawByFiftyMoves === 'function' && game.isDrawByFiftyMoves()) return 'Fifty-move rule';
                return 'Draw';
              }

              '''
              text = text.replace("function updatePanels() {", helper + "function updatePanels() {", 1)
              text = text.replace("const gameOver = game.isGameOver();", "const gameOver = isGameOverState();", 1)
              text = text.replace("game.isGameOver()", "isGameOverState()")
              text = text.replace(": game.isDraw() ? 'DRAW'", ": isDrawState() ? 'DRAW'")
              text = text.replace("const draw = game.isDraw();", "const draw = isDrawState();\n  const drawReason = draw ? getDrawReason() : null;", 1)
              text = text.replace("resultBadge.textContent = checkmate ? `${winner} CLAIMS THE CROWN` : draw ? 'DRAWN BATTLE' : 'GAME COMPLETE';", "resultBadge.textContent = checkmate ? `${winner} CLAIMS THE CROWN` : draw ? `DRAW · ${drawReason.toUpperCase()}` : 'GAME COMPLETE';", 1)
              text = text.replace("resultTitle.textContent = quality.title;", "resultTitle.textContent = draw ? 'THE BATTLE FALLS SILENT' : quality.title;", 1)
              text = text.replace("resultCopy.textContent = quality.copy;", "resultCopy.textContent = draw ? `The game ends in ${drawReason.toLowerCase()}. The archive preserves the final position.` : quality.copy;", 1)
              text += "\\n" + marker + "\\n"
              path.write_text(text, encoding="utf-8")
          PY

      - name: Syntax check
        run: node --check app.js

      - name: Chess draw rules smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save chess.js@1.4.0 >/dev/null 2>&1
          node <<'NODE'
          const { Chess } = require('chess.js');

          const cases = [
            ['King vs King', '8/8/8/8/8/8/4k3/4K3 w - - 0 1'],
            ['King + Bishop vs King', '4k3/8/8/8/8/8/4K3/5B2 w - - 0 1'],
            ['King + Knight vs King', '4k3/8/8/8/8/8/4K3/5N2 w - - 0 1'],
          ];

          for (const [label, fen] of cases) {
            const chess = new Chess(fen);
            if (!chess.isInsufficientMaterial() || !chess.isGameOver() || !chess.isDraw()) {
              throw new Error(`${label} was not detected as a draw`);
            }
            console.log(`PASS: ${label}`);
          }

          const threefold = new Chess();
          for (const san of ['Nf3', 'Nf6', 'Ng1', 'Ng8', 'Nf3', 'Nf6', 'Ng1', 'Ng8']) threefold.move(san);
          if (!threefold.isThreefoldRepetition() || !threefold.isGameOver()) throw new Error('Threefold repetition was not detected');
          console.log('PASS: Threefold repetition');
          NODE

      - name: Commit stability patch when needed
        run: |
          if git diff --quiet; then
            echo "No stability patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: make draw outcomes explicit"
          git push
