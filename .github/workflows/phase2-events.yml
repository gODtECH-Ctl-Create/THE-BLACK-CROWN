name: Phase 2 Crown Events

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check landing script
        run: node --check landing.js

      - name: Syntax check settings chamber
        run: node --check settings.js

      - name: Syntax check settings bridge
        run: node --check settings-bridge.js

      - name: Syntax check game engine
        run: node --check app.js

      - name: Syntax check Chronicle replay
        run: node --check chronicle-replay.js

      - name: Syntax check Crown Event director
        run: node --check crown-events.js

      - name: Syntax check special move auditor
        run: node --check special-move-audit.js

      - name: Syntax check pawn Queen strike director
        run: node --check pawn-queen-strike.js

      - name: Syntax check promotion transformation director
        run: node --check promotion-transformation.js

      - name: Syntax check Crown difficulty engine
        run: node --check crown-difficulty.js

      - name: Syntax check difficulty controller
        run: node --check difficulty-controller.js

      - name: Syntax check game soundscape
        run: node --check soundscape.js

      - name: Syntax check Hall of Records
        run: node --check records.js

      - name: Install chess.js for rule audit
        run: npm install --no-save chess.js@1.4.0

      - name: Run special move audit
        run: node tests/special-moves.mjs

      - name: Run Crown difficulty audit
        run: node tests/difficulty.mjs
