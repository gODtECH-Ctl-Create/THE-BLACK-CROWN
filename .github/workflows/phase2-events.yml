name: Phase 2 Crown Events

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check game engine
        run: node --check app.js

      - name: Syntax check Crown Event director
        run: node --check crown-events.js

      - name: Syntax check special move auditor
        run: node --check special-move-audit.js

      - name: Syntax check pawn Queen strike director
        run: node --check pawn-queen-strike.js

      - name: Install chess.js for rule audit
        run: npm install --no-save chess.js@1.4.0

      - name: Run special move audit
        run: node tests/special-moves.mjs
