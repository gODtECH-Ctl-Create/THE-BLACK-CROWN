name: Phase 2 Crown Events

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check game engine
        run: node --check app.js

      - name: Syntax check Crown Event director
        run: node --check crown-events.js
