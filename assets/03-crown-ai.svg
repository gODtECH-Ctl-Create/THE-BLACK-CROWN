  <style>.s{font:700 11px Arial,sans-serif;letter-spacing:3px;fill:#8e897f}.t{font:800 28px Georgia,serif;letter-spacing:2px;fill:#eee8db}.g{fill:#b8a47a}.r{fill:#9e2e2e}.line{stroke:#b8a47a;stroke-opacity:.23}</style>
